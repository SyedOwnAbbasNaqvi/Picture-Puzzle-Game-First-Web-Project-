<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Picture Puzzle Game</title>

  <link
  rel="stylesheet"
  href="style.css">
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

  <h2>🧩 Puzzle Game</h2>

  <div class="nav-links">

    <a href="index.html">
      Player Panel
    </a>

    <a href="admin.html">
      Admin Panel
    </a>

  </div>

</nav>

<div class="container">

  <h1>🧩 Picture Puzzle Game</h1>

  <div id="loadingMessage"></div>

  <div id="errorMessage"></div>
    <!-- TOP CONTROLS -->

  <section class="top-controls">

    <div class="saved-images">

      <img
      src="images/Scene.png"
      alt="Scene"
      class="saved-img active-image"
      onclick="selectDefaultImage(this)">

      <img
      src="images/playground.png"
      alt="Playground"
      class="saved-img"
      onclick="selectDefaultImage(this)">

      <img
      src="images/ferocious-wild-tiger-nature.jpg"
      alt="Tiger"
      class="saved-img"
      onclick="selectDefaultImage(this)">

    </div>

    <input
    type="file"
    id="uploadInput"
    accept="image/*">

    <select id="difficulty">

      <option value="3">
        Easy (3x3)
      </option>

      <option value="4" selected>
        Medium (4x4)
      </option>

      <option value="5">
        Hard (5x5)
      </option>

    </select>

    <div class="form-group">

      <input
      type="text"
      id="playerName"
      placeholder="Enter your name">

      <small id="nameError"></small>

    </div>

    <button id="startBtn">
      🚀 Start Game
    </button>

  </section>
